<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mosaic — TMDB Integration & Security Test Suite</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --text: #f0f4f8;
      --text-muted: #8c9cb8;
      --pass: #10b981;
      --fail: #ef4444;
      --skip: #f59e0b;
      --border: rgba(255, 255, 255, 0.1);
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 2rem;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.8rem;
    }

    .meta {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .actions {
      margin: 1.5rem 0;
      display: flex;
      gap: 1rem;
    }

    button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1.2rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 150ms ease;
    }

    button:hover {
      background: #1d4ed8;
    }

    .summary-card {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }

    .stat-number {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 0.2rem;
    }

    .stat-pass { color: var(--pass); }
    .stat-fail { color: var(--fail); }
    .stat-total { color: var(--text); }
    .stat-time { color: var(--text-muted); }

    .test-suite {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .suite-header {
      background: rgba(255, 255, 255, 0.03);
      padding: 0.8rem 1.2rem;
      font-weight: 700;
      font-size: 1.1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .test-item {
      padding: 0.75rem 1.2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      font-size: 0.92rem;
    }

    .test-item:last-child {
      border-bottom: none;
    }

    .test-badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .badge-pass { background: rgba(16, 185, 129, 0.2); color: var(--pass); }
    .badge-fail { background: rgba(239, 68, 68, 0.2); color: var(--fail); }
    .badge-running { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }

    .test-details {
      flex: 1;
    }

    .test-error {
      margin-top: 0.4rem;
      padding: 0.5rem;
      background: rgba(239, 68, 68, 0.1);
      border-left: 3px solid var(--fail);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: #fca5a5;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>TMDB Provider Integration & Security Tests</h1>
      <div class="meta">
        <strong>Assigned:</strong> Md. Migdadur Rahman Khan (ID: 46) &nbsp;|&nbsp;
        <strong>Scope:</strong> TMDB Client, Error Handling, API Security, Schema Normalization, Content Safety
      </div>
    </header>

    <div class="actions">
      <button id="run-tests-btn" type="button">Run All Integration Tests</button>
      <a href="/explore" style="color: #60a5fa; align-self: center; text-decoration: none;">← Back to App</a>
    </div>

    <div class="summary-card">
      <div class="stat-box">
        <div class="stat-number stat-total" id="stat-total">0</div>
        <div>Total Tests</div>
      </div>
      <div class="stat-box">
        <div class="stat-number stat-pass" id="stat-pass">0</div>
        <div>Passed</div>
      </div>
      <div class="stat-box">
        <div class="stat-number stat-fail" id="stat-fail">0</div>
        <div>Failed</div>
      </div>
      <div class="stat-box">
        <div class="stat-number stat-time" id="stat-time">0 ms</div>
        <div>Duration</div>
      </div>
    </div>

    <div id="test-results"></div>
  </div>

  <script type="module">
    import {
      TmdbError,
      getApiKey,
      hasApiKey,
      clearCache,
      isRestrictedContent,
      normalizeMedia,
      normalizeMediaDetails,
      imageUrl,
      checkProviderHealth
    } from "./src/api/tmdb.js";

    const resultsContainer = document.querySelector("#test-results");
    const statTotal = document.querySelector("#stat-total");
    const statPass = document.querySelector("#stat-pass");
    const statFail = document.querySelector("#stat-fail");
    const statTime = document.querySelector("#stat-time");
    const runBtn = document.querySelector("#run-tests-btn");

    function assert(condition, message) {
      if (!condition) {
        throw new Error(message || "Assertion failed");
      }
    }

    function assertEqual(actual, expected, message) {
      if (actual !== expected) {
        throw new Error(`${message || "Values differ"}: Expected "${expected}", got "${actual}"`);
      }
    }

    const testSuites = [
      {
        name: "Suite 1: API Key & Security Management",
        tests: [
          {
            name: "getApiKey() returns string or throws informative TmdbError",
            fn: () => {
              if (hasApiKey()) {
                const key = getApiKey();
                assert(typeof key === "string" && key.length > 5, "Key should be non-empty string");
              } else {
                let threw = false;
                try {
                  getApiKey();
                } catch (e) {
                  threw = true;
                  assert(e instanceof TmdbError, "Expected TmdbError when key missing");
                  assert(e.isAuthError, "Error should flag isAuthError");
                }
                assert(threw, "getApiKey() should throw when no key configured");
              }
            }
          },
          {
            name: "Security Guard: Rejects Supabase secret key or private tokens",
            fn: () => {
              // Simulate malicious or mistaken secret configuration in window.MOSAIC_CONFIG
              const prev = window.MOSAIC_CONFIG?.tmdbApiKey;
              window.MOSAIC_CONFIG = { tmdbApiKey: "sbp_secret_token_12345" };

              let caughtSecurityAlert = false;
              try {
                getApiKey();
              } catch (e) {
                if (e.message.includes("Security Alert")) {
                  caughtSecurityAlert = true;
                }
              } finally {
                window.MOSAIC_CONFIG = { tmdbApiKey: prev };
              }

              assert(caughtSecurityAlert, "getApiKey must block secret service keys from browser execution");
            }
          },
          {
            name: "imageUrl() constructs valid CDN image path with fallback",
            fn: () => {
              const url = imageUrl("/sample.jpg", "w500");
              assertEqual(url, "https://image.tmdb.org/t/p/w500/sample.jpg", "Image URL mismatch");
              assertEqual(imageUrl(null), "", "Null poster path should return empty string");
            }
          }
        ]
      },
      {
        name: "Suite 2: Error Handling Taxonomy & Resilience",
        tests: [
          {
            name: "TmdbError correctly identifies HTTP status codes",
            fn: () => {
              const err401 = new TmdbError("Unauthorized", { status: 401 });
              assert(err401.isAuthError === true, "401 must flag isAuthError");

              const err404 = new TmdbError("Not Found", { status: 404 });
              assert(err404.isNotFound === true, "404 must flag isNotFound");

              const err429 = new TmdbError("Rate limited", { status: 429 });
              assert(err429.isRateLimited === true, "429 must flag isRateLimited");

              const err500 = new TmdbError("Server error", { status: 500 });
              assert(err500.isServerError === true, "500 must flag isServerError");

              const errTimeout = new TmdbError("Timed out", { isTimeout: true });
              assert(errTimeout.isTimeout === true, "Timeout must flag isTimeout");
            }
          },
          {
            name: "clearCache() empties internal cache store",
            fn: () => {
              clearCache();
              assert(true, "clearCache executed successfully");
            }
          }
        ]
      },
      {
        name: "Suite 3: Content Safety & Moderation Filter",
        tests: [
          {
            name: "isRestrictedContent blocks items marked adult: true",
            fn: () => {
              const adultItem = { adult: true, title: "Ordinary Title" };
              assert(isRestrictedContent(adultItem) === true, "Adult flag must be filtered");
            }
          },
          {
            name: "isRestrictedContent filters explicit sexual keywords",
            fn: () => {
              const badTitles = [
                { title: "Erotic Whispers", overview: "A story." },
                { title: "Standard Movie", overview: "Contains explicit porn and sex scenes." },
                { title: "Dangerous Bondage", overview: "Action drama" }
              ];

              badTitles.forEach((item) => {
                assert(isRestrictedContent(item) === true, `Expected "${item.title}" to be restricted`);
              });
            }
          },
          {
            name: "isRestrictedContent permits safe mainstream titles",
            fn: () => {
              const safeItems = [
                { title: "Inception", overview: "A thief who steals corporate secrets through dream-sharing." },
                { title: "The Dark Knight", overview: "Batman raises the stakes in his war on crime." },
                { title: "Interstellar", overview: "A team of explorers travel through a wormhole." }
              ];

              safeItems.forEach((item) => {
                assert(isRestrictedContent(item) === false, `Expected "${item.title}" to be permitted`);
              });
            }
          }
        ]
      },
      {
        name: "Suite 4: Media Normalization Schemas",
        tests: [
          {
            name: "normalizeMedia maps movie & TV fields into Mosaic contract",
            fn: () => {
              const rawMovie = {
                id: 101,
                title: "Dune",
                poster_path: "/dune.jpg",
                backdrop_path: "/dune_bg.jpg",
                release_date: "2021-10-22",
                vote_average: 8.2,
                overview: "Paul Atreides arrives on Arrakis."
              };

              const normalized = normalizeMedia(rawMovie, "movie");
              assertEqual(normalized.id, 101, "ID match");
              assertEqual(normalized.type, "movie", "Type match");
              assertEqual(normalized.title, "Dune", "Title match");
              assertEqual(normalized.posterPath, "/dune.jpg", "Poster match");
              assertEqual(normalized.rating, 8.2, "Rating match");
            }
          },
          {
            name: "normalizeMediaDetails formats runtimes, dates, and genres",
            fn: () => {
              const rawDetails = {
                id: 550,
                title: "Fight Club",
                runtime: 139,
                release_date: "1999-10-15",
                vote_average: 8.433,
                genres: [{ id: 18, name: "Drama" }, { id: 53, name: "Thriller" }],
                spoken_languages: [{ english_name: "English" }]
              };

              const details = normalizeMediaDetails(rawDetails, "movie");
              assertEqual(details.runtime, "2h 19m", "Runtime formatting");
              assertEqual(details.releaseYear, 1999, "Release year extraction");
              assertEqual(details.genres.length, 2, "Genres count");
              assertEqual(details.genres[0], "Drama", "Genre name");
            }
          }
        ]
      },
      {
        name: "Suite 5: Provider Health & Connectivity Check",
        tests: [
          {
            name: "checkProviderHealth() reports provider status structure",
            fn: async () => {
              const result = await checkProviderHealth();
              assert(typeof result.ok === "boolean", "Result must contain boolean ok flag");
              assert(typeof result.status === "string", "Result must contain status string");
            }
          }
        ]
      }
    ];

    async function runAllTests() {
      resultsContainer.innerHTML = "";
      let total = 0;
      let passed = 0;
      let failed = 0;
      const startTime = performance.now();

      for (const suite of testSuites) {
        const suiteEl = document.createElement("div");
        suiteEl.className = "test-suite";

        const headerEl = document.createElement("div");
        headerEl.className = "suite-header";
        headerEl.textContent = suite.name;
        suiteEl.appendChild(headerEl);

        for (const test of suite.tests) {
          total += 1;
          const itemEl = document.createElement("div");
          itemEl.className = "test-item";

          const badgeEl = document.createElement("span");
          badgeEl.className = "test-badge badge-running";
          badgeEl.textContent = "RUN";

          const detailsEl = document.createElement("div");
          detailsEl.className = "test-details";
          detailsEl.textContent = test.name;

          itemEl.appendChild(badgeEl);
          itemEl.appendChild(detailsEl);
          suiteEl.appendChild(itemEl);

          try {
            await test.fn();
            badgeEl.className = "test-badge badge-pass";
            badgeEl.textContent = "PASS";
            passed += 1;
          } catch (err) {
            badgeEl.className = "test-badge badge-fail";
            badgeEl.textContent = "FAIL";
            failed += 1;

            const errEl = document.createElement("div");
            errEl.className = "test-error";
            errEl.textContent = err.message || String(err);
            detailsEl.appendChild(errEl);
          }

          statTotal.textContent = total;
          statPass.textContent = passed;
          statFail.textContent = failed;
        }

        resultsContainer.appendChild(suiteEl);
      }

      const duration = Math.round(performance.now() - startTime);
      statTime.textContent = `${duration} ms`;
    }

    runBtn.addEventListener("click", runAllTests);
    // Auto-run on load
    runAllTests();
  </script>
</body>
</html>
